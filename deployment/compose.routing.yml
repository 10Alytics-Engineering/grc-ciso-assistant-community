x-dns: &dns
  image: coredns/coredns:1.14.7
  restart: unless-stopped
  command: ["-conf", "/etc/coredns/Corefile"]
  read_only: true
  user: "65532:65532"
  cap_drop: [ALL]
  cap_add: [NET_BIND_SERVICE]
  security_opt: ["no-new-privileges:true"]
  volumes: ["./routing:/etc/coredns:ro"]
  logging:
    driver: json-file
    options: {max-size: "5m", max-file: "2"}
services:
  dns-a:
    <<: *dns
    container_name: grc-release-dns-a
  dns-b:
    <<: *dns
    container_name: grc-release-dns-b
networks:
  default:
    external: true
    name: grc_default
