subject: "Welcome to 10A GRC Lab!"
body: |
  ## Welcome to 10A GRC Lab!

  **Your all-in-one GRC Management Platform**

  You have been granted access to 10A GRC Lab. To get started, connect using the link below and use SSO login:

  [Connect to 10A GRC Lab](${ciso_assistant_url})

  If you have trouble with the link, copy and paste the following URL in your browser:
  ${ciso_assistant_url}

  If you, or your organization, did not make this request, you can simply ignore this email.

  Sincerely,
  10A GRC Lab Team
