subject: "10A GRC Lab : Le formulaire rapide '${response_name}' a été rouvert"
body: |
  Bonjour,

  La réponse suivante vous a été renvoyée pour modifications :

  - Réponse : ${response_name}
  - Formulaire : ${quick_form_name}
  - Note du relecteur : ${observation}

  Veuillez vous connecter à 10A GRC Lab pour mettre à jour vos réponses : [Ouvrir le formulaire](${ciso_assistant_url}/quick-form-responses/${response_id})

  Merci.
