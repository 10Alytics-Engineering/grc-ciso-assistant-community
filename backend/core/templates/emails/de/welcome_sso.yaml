subject: "Willkommen bei 10A GRC Lab!"
body: |
  ## Willkommen bei 10A GRC Lab!

  **Ihre zentrale GRC-Managementplattform**

  Sie haben Zugriff auf 10A GRC Lab erhalten. Öffnen Sie zum Einstieg den folgenden Link und melden Sie sich über SSO an:

  [Mit 10A GRC Lab verbinden](${ciso_assistant_url})

  Falls der Link nicht funktioniert, kopieren Sie die folgende Adresse in Ihren Browser:
  ${ciso_assistant_url}

  Falls weder Sie noch Ihre Organisation diese Anfrage gestellt haben, können Sie diese E-Mail ignorieren.

  Freundliche Grüße
  Ihr 10A GRC Lab-Team
