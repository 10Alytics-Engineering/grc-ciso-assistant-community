subject: "10A GRC Lab: Ihre Aufgabe für '${assessment_name}' hat begonnen"
body: |
  Hallo,

  Ihre Aufgabe für das folgende Audit hat begonnen und kann bearbeitet werden:

  - Audit: ${assessment_name}
  - Referenzwerk: ${framework_name}
  - Fällig am: ${due_date}

  Melden Sie sich in Ihrem 10A GRC Lab-Portal an, um mit der Bearbeitung zu beginnen: [10A GRC Lab öffnen](${ciso_assistant_url}/auditee-dashboard)

  Vielen Dank.
