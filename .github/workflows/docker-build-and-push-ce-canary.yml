name: Build/Push Canary Images - CE
permissions:
  contents: read
on:
  push:
    branches: [main]
    tags:
      - "canary-*"
  workflow_dispatch:
# Never interrupt a release while it is backing up or migrating production.
concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: false
env:
  UBUNTU_VERSION: "ubuntu-24.04"
jobs:
  prepare:
    runs-on: ubuntu-24.04
    outputs:
      version: ${{ steps.version.outputs.version }}
      build: ${{ steps.version.outputs.build }}
      repository: ${{ steps.version.outputs.repository }}
    steps:
      - name: Checkout Repository
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false
          fetch-depth: 0
      - name: Validate deployment scripts
        run: |
          bash -n deployment/deploy.sh
          shellcheck deployment/deploy.sh
          python3 -m unittest discover -s deployment -p 'test_*.py' -v
      - name: Generate version
        id: version
        shell: bash
        run: |
          set -euo pipefail
          CANARY_VERSION="canary-$(date +'%Y%m%d')-$(git rev-parse --short HEAD)-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}"
          echo "version=${CANARY_VERSION}" >> "$GITHUB_OUTPUT"
          echo "build=$(git rev-parse --short HEAD)" >> "$GITHUB_OUTPUT"
          echo "repository=${GITHUB_REPOSITORY,,}" >> "$GITHUB_OUTPUT"

  build-frontend:
    needs: prepare
    runs-on: ${{ matrix.runner }}
    permissions:
      contents: read
      packages: write
    strategy:
      matrix:
        include:
          - arch: amd64
            runner: ubuntu-24.04
    steps:
      - name: Checkout Repository
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3.12.0
      - name: Log in to GitHub Container Registry
        uses: docker/login-action@af1e73f918a031802d376d3c8bbc3fe56130a9b0 # v4.4.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Extract frontend metadata
        id: meta-frontend
        uses: docker/metadata-action@c299e40c65443455700f0fdfc63efafe5b349051 # v5.10.0
        with:
          images: ghcr.io/${{ needs.prepare.outputs.repository }}/frontend
          tags: |
            type=raw,value=${{ needs.prepare.outputs.version }}
          labels: |
            org.opencontainers.image.title=CISO Assistant Frontend
            org.opencontainers.image.description=An open-source GRC platform for cybersecurity compliance and risk management
            org.opencontainers.image.vendor=intuitem
            org.opencontainers.image.licenses=AGPL-3.0
            org.opencontainers.image.url=https://intuitem.com
            org.opencontainers.image.documentation=https://intuitem.gitbook.io/ciso-assistant
      - name: Build and Push
        uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8 # v6.19.2
        with:
          context: ./frontend
          file: ./frontend/Dockerfile
          push: true
          tags: ghcr.io/${{ needs.prepare.outputs.repository }}/frontend:${{ needs.prepare.outputs.version }}-${{ matrix.arch }}
          platforms: linux/${{ matrix.arch }}
          labels: ${{ steps.meta-frontend.outputs.labels }}
          annotations: ${{ steps.meta-frontend.outputs.annotations }}

  build-backend:
    needs: prepare
    runs-on: ${{ matrix.runner }}
    permissions:
      contents: read
      packages: write
    strategy:
      matrix:
        include:
          - arch: amd64
            runner: ubuntu-24.04
    steps:
      - name: Checkout Repository
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false
      - name: Create .meta file
        shell: bash
        env:
          CISO_ASSISTANT_VERSION: ${{ needs.prepare.outputs.version }}
          CISO_ASSISTANT_BUILD: ${{ needs.prepare.outputs.build }}
        run: |
          set -euo pipefail
          {
            echo "CISO_ASSISTANT_VERSION=$CISO_ASSISTANT_VERSION"
            echo "CISO_ASSISTANT_BUILD=$CISO_ASSISTANT_BUILD"
          } > .meta
          cp .meta ./backend/
          cp .meta ./backend/ciso_assistant/
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3.12.0
      - name: Log in to GitHub Container Registry
        uses: docker/login-action@af1e73f918a031802d376d3c8bbc3fe56130a9b0 # v4.4.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Extract backend metadata
        id: meta-backend
        uses: docker/metadata-action@c299e40c65443455700f0fdfc63efafe5b349051 # v5.10.0
        with:
          images: ghcr.io/${{ needs.prepare.outputs.repository }}/backend
          tags: |
            type=raw,value=${{ needs.prepare.outputs.version }}
          labels: |
            org.opencontainers.image.title=CISO Assistant Backend
            org.opencontainers.image.description=An open-source GRC platform for cybersecurity compliance and risk management
            org.opencontainers.image.vendor=intuitem
            org.opencontainers.image.licenses=AGPL-3.0
            org.opencontainers.image.url=https://intuitem.com
            org.opencontainers.image.documentation=https://intuitem.gitbook.io/ciso-assistant
      - name: Build and Push
        uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8 # v6.19.2
        with:
          context: ./backend
          file: ./backend/Dockerfile
          push: true
          tags: ghcr.io/${{ needs.prepare.outputs.repository }}/backend:${{ needs.prepare.outputs.version }}-${{ matrix.arch }}
          platforms: linux/${{ matrix.arch }}
          labels: ${{ steps.meta-backend.outputs.labels }}
          annotations: ${{ steps.meta-backend.outputs.annotations }}

  merge-manifests:
    needs: [prepare, build-frontend, build-backend]
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      packages: write
    steps:
      - name: Log in to GitHub Container Registry
        uses: docker/login-action@af1e73f918a031802d376d3c8bbc3fe56130a9b0 # v4.4.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Publish release manifests
        shell: bash
        env:
          REPO: ${{ needs.prepare.outputs.repository }}
          VERSION: ${{ needs.prepare.outputs.version }}
          GIT_SHA: ${{ github.sha }}
        run: |
          set -euo pipefail
          CREATED="$(date -u +'%Y-%m-%dT%H:%M:%SZ')"

          # Frontend
          docker buildx imagetools create \
            --annotation "index:org.opencontainers.image.title=CISO Assistant Frontend" \
            --annotation "index:org.opencontainers.image.description=An open-source GRC platform for cybersecurity compliance and risk management" \
            --annotation "index:org.opencontainers.image.vendor=intuitem" \
            --annotation "index:org.opencontainers.image.licenses=AGPL-3.0" \
            --annotation "index:org.opencontainers.image.url=https://intuitem.com" \
            --annotation "index:org.opencontainers.image.documentation=https://intuitem.gitbook.io/ciso-assistant" \
            --annotation "index:org.opencontainers.image.source=https://github.com/$REPO" \
            --annotation "index:org.opencontainers.image.version=$VERSION" \
            --annotation "index:org.opencontainers.image.revision=$GIT_SHA" \
            --annotation "index:org.opencontainers.image.created=$CREATED" \
            -t "ghcr.io/$REPO/frontend:$VERSION" \
            -t "ghcr.io/$REPO/frontend:canary" \
            "ghcr.io/$REPO/frontend:$VERSION-amd64"

          # Backend
          docker buildx imagetools create \
            --annotation "index:org.opencontainers.image.title=CISO Assistant Backend" \
            --annotation "index:org.opencontainers.image.description=An open-source GRC platform for cybersecurity compliance and risk management" \
            --annotation "index:org.opencontainers.image.vendor=intuitem" \
            --annotation "index:org.opencontainers.image.licenses=AGPL-3.0" \
            --annotation "index:org.opencontainers.image.url=https://intuitem.com" \
            --annotation "index:org.opencontainers.image.documentation=https://intuitem.gitbook.io/ciso-assistant" \
            --annotation "index:org.opencontainers.image.source=https://github.com/$REPO" \
            --annotation "index:org.opencontainers.image.version=$VERSION" \
            --annotation "index:org.opencontainers.image.revision=$GIT_SHA" \
            --annotation "index:org.opencontainers.image.created=$CREATED" \
            -t "ghcr.io/$REPO/backend:$VERSION" \
            -t "ghcr.io/$REPO/backend:canary" \
            "ghcr.io/$REPO/backend:$VERSION-amd64"

  deployment-archives:
    needs: [prepare, merge-manifests]
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      packages: read
    strategy:
      matrix:
        component: [backend, frontend]
    steps:
      - name: Log in to GitHub Container Registry
        uses: docker/login-action@af1e73f918a031802d376d3c8bbc3fe56130a9b0 # v4.4.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Export pinned deployment image
        env:
          IMAGE: ghcr.io/${{ needs.prepare.outputs.repository }}/${{ matrix.component }}:${{ needs.prepare.outputs.version }}
        run: |
          set -euo pipefail
          docker pull "$IMAGE"
          docker save "$IMAGE" | gzip -1 > image.tar.gz
          sha256sum image.tar.gz > image.tar.gz.sha256
      - name: Store deployment archive
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: ${{ matrix.component }}-${{ needs.prepare.outputs.version }}
          path: |
            image.tar.gz
            image.tar.gz.sha256
          compression-level: 0
          retention-days: 3

  deploy:
    name: Deploy GRC Lab
    needs: [prepare, merge-manifests]
    if: github.repository == '10Alytics-Engineering/grc-ciso-assistant-community' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    permissions:
      contents: read
      packages: read
    environment:
      name: production
      url: https://grc.10alytics.io
    concurrency:
      group: grc-production
      cancel-in-progress: false
    env:
      DEPLOY_HOST: ${{ vars.GRC_DEPLOY_HOST }}
      RELEASE_TAG: ${{ needs.prepare.outputs.version }}
    steps:
      - name: Checkout release
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false
      - name: Check release is still the main branch tip
        id: current
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          latest=$(gh api "repos/$GITHUB_REPOSITORY/git/ref/heads/main" --jq .object.sha)
          if [[ "$latest" == "$GITHUB_SHA" ]]; then
            echo "deploy=true" >> "$GITHUB_OUTPUT"
          else
            echo "A newer commit is on main; its workflow will deploy instead." >> "$GITHUB_STEP_SUMMARY"
          fi
      - name: Configure deployment SSH key
        if: steps.current.outputs.deploy == 'true'
        env:
          DEPLOY_KEY: ${{ secrets.GRC_DEPLOY_SSH_KEY }}
          KNOWN_HOSTS: ${{ secrets.GRC_DEPLOY_KNOWN_HOSTS }}
        run: |
          set -euo pipefail
          [[ "$DEPLOY_HOST" =~ ^[a-zA-Z0-9.-]+$ ]]
          [[ "$RELEASE_TAG" =~ ^canary-[a-zA-Z0-9-]+$ ]]
          test -n "$DEPLOY_KEY"
          test -n "$KNOWN_HOSTS"
          install -m 700 -d ~/.ssh
          printf '%s\n' "$DEPLOY_KEY" > ~/.ssh/grc_deploy
          printf '%s\n' "$KNOWN_HOSTS" > ~/.ssh/known_hosts
          chmod 600 ~/.ssh/grc_deploy ~/.ssh/known_hosts
          cat > ~/.ssh/config <<EOF
          Host grc-production
            HostName $DEPLOY_HOST
            User root
            IdentityFile ~/.ssh/grc_deploy
            IdentitiesOnly yes
            BatchMode yes
            StrictHostKeyChecking yes
            ConnectTimeout 15
            ServerAliveInterval 30
            ServerAliveCountMax 10
          EOF
      - name: Stage release files
        if: steps.current.outputs.deploy == 'true'
        run: |
          set -euo pipefail
          ssh grc-production "install -d -m 700 /opt/ciso/releases/$RELEASE_TAG"
          scp deployment/compose.slot.yml deployment/Caddyfile.slot deployment/deploy.sh deployment/deploy.py deployment/compose.routing.yml deployment/Corefile \
            "grc-production:/opt/ciso/releases/$RELEASE_TAG/"
      - name: Back up and deploy
        if: steps.current.outputs.deploy == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          printf '%s\n' "$GH_TOKEN" | ssh grc-production \
            "bash /opt/ciso/releases/$RELEASE_TAG/deploy.sh '$RELEASE_TAG' '$GITHUB_ACTOR'"
          echo "Deployed $GITHUB_SHA as $RELEASE_TAG to https://grc.10alytics.io" >> "$GITHUB_STEP_SUMMARY"
      - name: Remove runner SSH credentials
        if: always()
        run: rm -f ~/.ssh/grc_deploy
